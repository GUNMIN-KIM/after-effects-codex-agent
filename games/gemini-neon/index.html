<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
</head>
<body>
<title>Gemini Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;800;900&display=swap">
<style>
/* Layout: one 9:16 stage, letterboxed and centered. The WebGL canvas fills it; HUD, a right-side camera rail and menus float above. */
:root{
  --void:#030108;
  --ink:#f4efff;
  --mute:#a99cc7;
  --castor:#2ee8ff;
  --pollux:#ff3fd2;
  --gold:#ffc34d;
  --danger:#ff4136;
  --glass:rgba(14,8,28,.55);
  --line:rgba(255,255,255,.16);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;left:50%;top:50%;width:360px;height:640px;transform:translate(-50%,-50%);overflow:hidden;background:#000;container-type:size;touch-action:none;cursor:crosshair;}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(4.5cqw + env(safe-area-inset-top,0px)) 5cqw calc(5cqw + env(safe-area-inset-bottom,0px));transition:opacity .5s ease;}
.hud.is-off{opacity:0;}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4cqw;}
.k{margin:0;font:700 2.3cqw/1 var(--f-mono);letter-spacing:.32em;color:var(--mute);text-transform:uppercase;}
.score{margin-top:1.4cqw;font:800 9.5cqw/.95 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 0 3cqw rgba(46,232,255,.35),0 0 6cqw rgba(255,63,210,.25);}
.best{margin-top:1.6cqw;font:500 2.6cqw/1 var(--f-mono);color:var(--mute);letter-spacing:.1em;}
.status{display:flex;flex-direction:column;align-items:flex-end;gap:2.4cqw;}
.mult{font:900 7cqw/1 var(--f-display);color:var(--gold);text-shadow:0 0 3cqw rgba(255,195,77,.55);transition:transform .2s;}
.mult.bump{transform:scale(1.25);}
.shields{display:flex;gap:2cqw;padding-right:.6cqw;}
.shields i{display:block;width:3cqw;height:3cqw;transform:rotate(45deg);border:.55cqw solid var(--castor);box-shadow:0 0 2cqw var(--castor);transition:border-color .3s,box-shadow .3s;}
.shields i:nth-child(2){border-color:#c79bff;box-shadow:0 0 2cqw #c79bff;}
.shields i:nth-child(3){border-color:var(--pollux);box-shadow:0 0 2cqw var(--pollux);}
.shields i.lost{border-color:rgba(255,255,255,.14);box-shadow:none;}
.hud-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
.readout{font:700 4.6cqw/1 var(--f-mono);font-variant-numeric:tabular-nums;}
.readout small{font-size:2.3cqw;color:var(--mute);letter-spacing:.2em;margin-left:1cqw;}

.callout{position:absolute;left:0;right:0;top:33%;text-align:center;pointer-events:none;font:900 10cqw/1 var(--f-display);letter-spacing:.03em;opacity:0;}
.callout.show{animation:pop 1.15s cubic-bezier(.2,.8,.2,1) forwards;}
.callout .sub{display:block;margin-top:2.2cqw;font:700 3cqw/1 var(--f-mono);letter-spacing:.28em;}
@keyframes pop{0%{opacity:0;transform:scale(1.5);filter:blur(6px)}14%{opacity:1;transform:scale(1);filter:blur(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-4cqw) scale(.96)}}

.rail{position:absolute;right:calc(2.4cqw + env(safe-area-inset-right,0px));top:17%;display:flex;flex-direction:column;gap:1.5cqw;transition:opacity .45s,transform .45s;}
.rail.is-menu{display:none;}
.rail.is-idle{opacity:0;transform:translateX(5cqw);pointer-events:none;}
.rb{appearance:none;border:0;background:none;padding:0;margin:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:.8cqw;cursor:pointer;font:600 1.9cqw/1 var(--f-body);text-shadow:0 1px 2px rgba(0,0,0,.8);}
.rb .ic{width:8.4cqw;height:8.4cqw;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s,border-color .2s,box-shadow .2s;}
.rb svg{width:4cqw;height:4cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.rb:hover .ic{border-color:rgba(255,255,255,.45);}
.rb:focus-visible{outline:none;}
.rb:focus-visible .ic{outline:2px solid var(--gold);outline-offset:2px;}
.rb[aria-pressed="true"] .ic{border-color:var(--castor);box-shadow:0 0 2.6cqw rgba(46,232,255,.45);}
.rb.rec .dot{fill:var(--danger);stroke:none;}
.rb.rec[aria-pressed="true"] .ic{background:rgba(255,65,54,.88);border-color:#ffc2bd;box-shadow:0 0 3cqw rgba(255,65,54,.7);}
.rb.rec[aria-pressed="true"] .dot{fill:#fff;}

.recbadge{position:absolute;top:calc(4.6cqw + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1.6cqw;padding:1.5cqw 3cqw;border-radius:999px;background:rgba(0,0,0,.6);font:700 2.8cqw/1 var(--f-mono);letter-spacing:.12em;pointer-events:none;}
.recbadge::before{content:"";width:2cqw;height:2cqw;border-radius:50%;background:var(--danger);animation:blink 1s steps(2,start) infinite;}
@keyframes blink{to{visibility:hidden;}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 7cqw calc(11cqw + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(3,1,8,.94) 0%,rgba(3,1,8,.6) 40%,rgba(3,1,8,0) 68%);cursor:default;}
.screen.split{justify-content:space-between;padding-top:calc(9cqw + env(safe-area-inset-top,0px));background:linear-gradient(to bottom,rgba(3,1,8,.78) 0%,rgba(3,1,8,0) 30%,rgba(3,1,8,0) 58%,rgba(3,1,8,.9) 78%,rgba(3,1,8,.96) 100%);}
.screen.center{justify-content:center;background:rgba(3,1,8,.62);}
.logo{font-family:var(--f-display);line-height:.88;letter-spacing:-.04em;margin:0;}
.logo .l1{display:block;font-weight:900;font-size:15.5cqw;background:linear-gradient(90deg,var(--castor) 0 49.5%,var(--pollux) 50.5% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 3cqw rgba(255,63,210,.35));}
.logo .l2{display:block;font-weight:800;font-size:15.5cqw;color:transparent;-webkit-text-stroke:.42cqw var(--ink);}
.tag{margin:0 0 5cqw;font:600 4.3cqw/1.45 var(--f-body);color:var(--ink);text-wrap:balance;}
.tag span{display:block;margin-top:1.2cqw;font-weight:400;font-size:3.3cqw;color:var(--mute);}
.btns{display:flex;gap:3cqw;}
.btn{flex:1;appearance:none;cursor:pointer;border-radius:999px;padding:4.2cqw 0;font:700 4.1cqw/1 var(--f-body);color:var(--void);background:var(--ink);border:0;}
.btn.primary{background:linear-gradient(90deg,var(--castor),#fff 50%,var(--pollux));box-shadow:0 0 6cqw rgba(255,63,210,.25);}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid rgba(255,255,255,.35);}
.btn:hover{filter:brightness(1.1);}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.hint{margin:5cqw 0 0;font:500 2.75cqw/1.75 var(--f-mono);color:var(--mute);}
.hint b{color:var(--ink);font-weight:700;}
.overscore{margin:2cqw 0 1cqw;font:900 17cqw/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--castor),#fff 50%,var(--pollux));-webkit-background-clip:text;background-clip:text;color:transparent;}
.pausetitle{margin:0 0 6cqw;font:900 10cqw/1 var(--f-display);text-align:center;}

.toast{position:absolute;left:50%;bottom:calc(16cqw + env(safe-area-inset-bottom,0px));transform:translate(-50%,2cqw);max-width:80cqw;padding:2.4cqw 4cqw;border-radius:2.4cqw;background:rgba(10,6,20,.86);border:1px solid var(--line);font:600 3cqw/1.4 var(--f-body);text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;}
.toast.show{opacity:1;transform:translate(-50%,0);}

.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;background:var(--void);transition:opacity .6s;z-index:5;}
.loading.done{opacity:0;pointer-events:none;}
.ld-logo{font:900 8cqw/1 var(--f-display);letter-spacing:-.02em;background:linear-gradient(90deg,var(--castor) 0 50%,var(--pollux) 50% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.loading p{margin:0;max-width:70cqw;text-align:center;font:500 3cqw/1.6 var(--f-mono);color:var(--mute);}
.ld-bar{width:40cqw;height:.6cqw;border-radius:1cqw;background:rgba(255,255,255,.1);overflow:hidden;}
.ld-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--castor),var(--pollux));animation:ld 1.2s ease-in-out infinite;}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion: reduce){.callout.show{animation-duration:.01s;opacity:1}.ld-bar i{animation:none}}
</style>

<div id="stage">
  <canvas id="gl" aria-label="Gemini Neon 3D 게임 화면"></canvas>

  <div id="hud" class="hud is-off" aria-hidden="true">
    <div class="hud-top">
      <div>
        <p class="k">Score</p>
        <div id="score" class="score">0</div>
        <div id="best" class="best">BEST 0</div>
      </div>
      <div class="status">
        <div id="mult" class="mult">×1</div>
        <div id="shields" class="shields"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="readout"><span id="spd">0</span><small>KM/H</small></div>
      <div class="readout"><span id="dst">0.00</span><small>KM</small></div>
    </div>
  </div>

  <div id="callout" class="callout" aria-live="polite"></div>
  <div id="recbadge" class="recbadge" hidden>REC <span id="rectime">00:00</span></div>

  <nav id="rail" class="rail" aria-label="촬영 도구">
    <button class="rb rec" id="bRec" type="button" aria-pressed="false" title="녹화 시작/정지 (R)"><span class="ic"><svg viewBox="0 0 24 24"><circle class="dot" cx="12" cy="12" r="6.5"/></svg></span>녹화</button>
    <button class="rb" id="bShot" type="button" title="PNG 스크린샷 (K)"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>캡처</button>
    <button class="rb" id="bCam" type="button" title="카메라 앵글 바꾸기 (C)"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></svg></span><span id="camLabel">추적</span></button>
    <button class="rb" id="bSlow" type="button" aria-pressed="false" title="슬로우 모션 (T)"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg></span>슬로우</button>
    <button class="rb" id="bHud" type="button" aria-pressed="true" title="HUD 표시 (H)"><span class="ic"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>HUD</button>
    <button class="rb" id="bRes" type="button" aria-pressed="false" title="1080×1920 고정 해상도"><span class="ic"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M10 18.5h4"/></svg></span>1080p</button>
    <button class="rb" id="bSnd" type="button" aria-pressed="true" title="사운드 켜기/끄기 (M)"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 9.5h4l5-4v13l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></span>사운드</button>
  </nav>

  <section id="menu" class="screen split" hidden>
    <h1 class="logo"><span class="l1">GEMINI</span><span class="l2">NEON</span></h1>
    <div class="actions">
    <p class="tag">두 기체, 하나의 빛줄기.<span>쌍둥이 비행선 카스토르와 폴룩스의 간격을 맞춰 네온 게이트를 통과하세요.</span></p>
    <div class="btns">
      <button class="btn primary" id="bPlay" type="button">플레이</button>
      <button class="btn ghost" id="bFilm" type="button">필름 모드</button>
    </div>
    <p class="hint"><b>드래그</b> 손가락 위치 = 오른쪽 기체 위치<br><b>← →</b> 모으기 / 벌리기 · <b>금색 가이드</b>를 따라가세요<br>필름 모드: 자동 주행 + 카메라 연출, HUD 없이 녹화 · 최고 <span id="menuBest">0</span></p>
    </div>
  </section>

  <section id="over" class="screen" hidden>
    <p class="k">Signal lost</p>
    <div id="overScore" class="overscore">0</div>
    <p class="tag" id="overInfo">거리 0 KM</p>
    <div class="btns">
      <button class="btn primary" id="bRetry" type="button">다시 시작</button>
      <button class="btn ghost" id="bOverMenu" type="button">메인으로</button>
    </div>
  </section>

  <section id="pause" class="screen center" hidden>
    <h2 class="pausetitle">일시정지</h2>
    <div class="btns">
      <button class="btn primary" id="bResume" type="button">계속하기</button>
      <button class="btn ghost" id="bQuit" type="button">메인으로</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status"></div>
  <div id="loading" class="loading"><div class="ld-logo">GEMINI NEON</div><div class="ld-bar"><i></i></div><p>셰이더 컴파일 · 텍스처 베이킹 중</p></div>
</div>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script>
window.__gnBootTimer = setTimeout(function () {
  if (window.__gnReady) return;
  var p = document.querySelector('#loading p');
  if (p) p.textContent = '3D 엔진을 불러오지 못했습니다. cdn.jsdelivr.net 연결을 확인한 뒤 새로고침하세요.';
}, 25000);
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   0. Helpers
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const canvas = $('gl');
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let R = mulberry32(7);              // gameplay random (re-seeded per run)
const RV = mulberry32(2026);        // set-dressing random
const rv = (a, b) => a + (b - a) * RV();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const SMIN = 0.7, SMAX = 2.7;      // twin spread (distance of each ship from the centre line)
const WING = 0.6;                   // wing half span
const HOVER = 0.56;                 // ship hover height
const SPAWN_Z = -235;
const WORLD_FRONT = 190, WORLD_LEN = 620;

const COL = {
  castor: new THREE.Color(0x2ee8ff),
  pollux: new THREE.Color(0xff3fd2),
  gold: new THREE.Color(0xffc34d),
  danger: new THREE.Color(0xff4136),
};
const hdr = (c, k) => c.clone().multiplyScalar(k);

/* =====================================================================
   1. Renderer, scene, camera, post-processing
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(1);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, 9 / 16, 0.08, 1500);
camera.position.set(0, 3.5, 8);

const U = {
  uTime: { value: 0 },
  uFogColor: { value: new THREE.Color().setRGB(0.05, 0.009, 0.055) },
  uFogDensity: { value: 0.008 },
  uColL: { value: COL.castor.clone() },
  uColR: { value: COL.pollux.clone() },
  uDanger: { value: COL.danger.clone() },
  uScroll: { value: 0 },
  uOver: { value: 0 },
};
const FOG = { uFogColor: U.uFogColor, uFogDensity: U.uFogDensity };
scene.fog = new THREE.FogExp2(0x000000, U.uFogDensity.value);
scene.fog.color.copy(U.uFogColor.value);

const msTarget = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, msTarget);
composer.setPixelRatio(1);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.6, 0.5, 1.0);
composer.addPass(bloom);
const lens = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(1080, 1920) }, uTime: U.uTime,
    uCA: { value: 0.0022 }, uVig: { value: 0.9 }, uGrain: { value: 0.035 }, uStreak: { value: 0.22 },
    uFlash: { value: 0 }, uFlashCol: { value: new THREE.Color(1, 1, 1) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime, uCA, uVig, uGrain, uStreak, uFlash; uniform vec3 uFlashCol;
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv; vec2 c = uv - 0.5;
      float r2 = dot(c, c);
      vec2 dir = c * uCA * (0.5 + r2 * 3.0);
      vec3 col;
      col.r = texture2D(tDiffuse, uv + dir).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - dir).b;
      // anamorphic streak: horizontal smear of the hottest pixels
      vec3 s = vec3(0.0);
      for (int i = 1; i <= 10; i++) {
        float o = float(i) * 0.013; float w = exp(-float(i) * 0.3);
        vec3 a = texture2D(tDiffuse, uv + vec2(o, 0.0)).rgb;
        vec3 b = texture2D(tDiffuse, uv - vec2(o, 0.0)).rgb;
        s += (max(a - 2.2, 0.0) + max(b - 2.2, 0.0)) * w;
      }
      col += s * vec3(0.32, 0.55, 1.0) * uStreak;
      float vig = smoothstep(0.95, 0.18, length(c * vec2(1.25, 1.0)));
      col *= mix(1.0, vig, uVig);
      col += uFlashCol * uFlash;
      float g = fract(sin(dot(floor(uv * uRes) + fract(uTime * 7.31) * 113.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (g - 0.5) * uGrain * (0.4 + 0.6 * col);
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`,
});
composer.addPass(lens);
composer.addPass(new OutputPass());

/* =====================================================================
   2. Shared GLSL
   ===================================================================== */
const GLSL_COMMON = /* glsl */`
uniform vec3 uFogColor; uniform float uFogDensity;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1.0,0.0)), u.x), mix(hash12(i+vec2(0.0,1.0)), hash12(i+vec2(1.0,1.0)), u.x), u.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; } return s; }
float fogF(float d){ return 1.0 - exp(-uFogDensity * uFogDensity * d * d); }
float lineAA(float d, float w){ float fw = fwidth(d) * 1.2; return 1.0 - smoothstep(w, w + fw, abs(d)); }
`;
const WORLD_VS = /* glsl */`
varying vec3 vWorld; varying float vDepth; varying vec2 vUv; varying vec3 vNormalW;
void main(){
  vUv = uv;
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorld = wp.xyz;
  vNormalW = normalize(mat3(modelMatrix) * normal);
  vec4 mv = viewMatrix * wp;
  vDepth = -mv.z;
  gl_Position = projectionMatrix * mv;
}`;

  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform float uTime, uOver; uniform vec3 uSunA, uSunB;
    varying vec3 vDir;
    ${GLSL_COMMON}
    vec3 stars(vec3 d){
      vec2 uv = vec2(atan(d.x, -d.z), asin(clamp(d.y, -1.0, 1.0))) * 70.0;
      vec2 id = floor(uv); vec2 f = fract(uv) - 0.5;
      float h = hash12(id);
      if (h < 0.9) return vec3(0.0);
      vec2 o = vec2(hash12(id + 3.1), hash12(id + 7.7)) - 0.5;
      float s = smoothstep(0.09, 0.0, length(f - o * 0.6));
      float tw = 0.55 + 0.45 * sin(uTime * (1.5 + h * 6.0) + h * 50.0);
      vec3 c = mix(vec3(0.6, 0.8, 1.0), vec3(1.0, 0.7, 0.9), hash12(id + 1.3));

    }
    void main(){
      vec3 d = normalize(vDir);
      float y = d.y;
      vec3 top = vec3(0.003, 0.002, 0.014);
      vec3 mid = vec3(0.040, 0.008, 0.080);
      vec3 hor = vec3(0.50, 0.05, 0.30);
      vec3 col = mix(mid, top, smoothstep(0.05, 0.65, y));
      col = mix(hor, col, smoothstep(-0.02, 0.24, y));
      vec3 M = normalize(uSunA + uSunB);
      float az = max(dot(normalize(vec3(d.x, 0.0, d.z) + 1e-5), normalize(vec3(M.x, 0.0, M.z))), 0.0);
      col += vec3(1.0, 0.28, 0.48) * exp(-abs(y - 0.01) * 26.0) * (0.35 + 0.55 * pow(az, 6.0));
      // nebula
      vec2 np = d.xz / (d.y + 0.35);
      float n = fbm(np * 1.5 + vec2(uTime * 0.004, 0.0));
      float n2 = fbm(np * 3.2 - 4.0);
      col += mix(vec3(0.06, 0.0, 0.13), vec3(0.0, 0.10, 0.17), n2) * smoothstep(0.45, 0.92, n) * smoothstep(0.05, 0.5, y) * 1.7;
      col += stars(d) * smoothstep(0.02, 0.25, y);
      // twin suns
      float a = acos(clamp(dot(d, uSunA), -1.0, 1.0));
      float b = acos(clamp(dot(d, uSunB), -1.0, 1.0));
      vec3 Rr = normalize(uSunB - uSunA);
      vec3 Up = normalize(cross(Rr, M));
      float fwd = dot(d, M);
      vec2 q = vec2(dot(d, Rr), dot(d, Up)) / max(fwd, 0.001);
      vec3 cA = vec3(0.45, 0.92, 1.0), cB = vec3(1.0, 0.4, 0.82);
      float surfA = 1.5 + 0.9 * fbm(q * 380.0 + uTime * 0.25);
      float surfB = 1.5 + 0.9 * fbm(q * 420.0 - uTime * 0.25);
      col += cA * (smoothstep(0.037, 0.034, a) * surfA + exp(-a * 34.0) * 0.55 + exp(-a * 7.0) * 0.14);
      col += cB * (smoothstep(0.029, 0.026, b) * surfB + exp(-b * 36.0) * 0.55 + exp(-b * 7.0) * 0.14);
      float hs = tan(0.5 * acos(dot(uSunA, uSunB)));
      float xn = clamp(q.x / hs, -1.0, 1.0);
      float arc = (1.0 - xn * xn) * hs * 0.36;
      float flow = fbm(vec2(q.x * 70.0 - uTime * 0.9, q.y * 70.0));
      float w = 0.0035 + 0.005 * flow;
      float stream = exp(-pow((q.y - arc) / w, 2.0)) * step(abs(q.x), hs) * (0.35 + flow) * smoothstep(-hs, -hs * 0.55, q.x);
      vec2 qb = q - vec2(hs, 0.0);
      float rr = length(vec2(qb.x, qb.y * 2.7));
      float ring = exp(-pow((rr - 0.052) / 0.006, 2.0)) * (0.6 + 0.4 * sin(atan(qb.y, qb.x) * 3.0 - uTime * 1.6));
      vec3 bridge = mix(cA, cB, xn * 0.5 + 0.5);
      col += (bridge * stream * 1.8 + vec3(1.0, 0.55, 0.9) * ring * 1.2) * step(0.0, fwd);
      col *= 1.0 + uOver * 0.25;
      col = mix(col, uFogColor, smoothstep(0.0, -0.06, y));
      gl_FragColor = vec4(col, 1.0);
    }`,
}));

    uniform float uTime, uOver;
    varying vec3 vP; varying vec3 vN; varying vec4 vInfo; varying float vDepth; varying vec3 vScale; varying vec3 vWorld;
    ${GLSL_COMMON}
    vec3 pal(float k){

  overdrive: 0, invuln: 0, timeScale: 1, shake: 0, flash: 0, level: 0,

let shipL, shipR, trails = [], sparks, shards;

function addScore(base) { S.score += base * S.mult; }
function damage() {
  if (S.mode !== 'play' || S.auto) { S.shake = Math.max(S.shake, 0.35); return; }
  if (S.overdrive > 0 || S.invuln > 0) return;
  S.shields--; S.combo = 0; S.invuln = 1.7; S.timeScale = 0.3; S.shake = 1; S.flash = 0.45; flashCol.copy(COL.danger);
  Sound.crash();

}

function spawnSection() {
  const lv = S.level;
  const slack = Math.max(0.24, 0.52 - lv * 0.035);
  const r = R();
  let ob;
  if (r < 0.52 || lv < 0.6) { ob = acquire('gate'); ob.spawn(lerp(0.85, 2.55, R()), slack, SPAWN_Z); }
  else if (r < 0.77) { ob = acquire('laser'); ob.spawn(lerp(1.75, 3.35, R()), SPAWN_Z); }
  else { ob = acquire('mono'); ob.spawn(lerp(0.3, 1.5, R()), SPAWN_Z); }
  ob.group.position.z = SPAWN_Z;
  // energy cores between the previous obstacle and this one, tracing the safe line
  const prevC = S.lastCenter, gap = S.gap;
  const wantStar = S.sinceStar > 1500;
  const n = Math.max(2, Math.floor(gap / 5.2) - 1);
  for (let i = 1; i <= n; i++) {
    const t = i / (n + 1);
    if (t < 0.16 || t > 0.86) continue;
    const z = SPAWN_Z + gap * t;
    if (wantStar && Math.abs(t - 0.5) < 0.12) continue;
    spawnCorePair(lerp(ob.center, prevC, sstep(0.1, 0.9, t)), z);
  }
  if (wantStar) { const st = acquire('star'); st.spawn(SPAWN_Z + gap * 0.5); S.sinceStar = 0; }
  S.lastCenter = ob.center;
}

function difficulty() {
  S.level = S.dist / 900;
  const base = Math.min(58, 24 + S.level * 3.2);
  S.speed = base * (S.overdrive > 0 ? 1.45 : 1) * (S.mode === 'over' ? 0.35 : 1);
  const interval = Math.max(1.05, 1.9 - S.level * 0.09);
  return base * interval;
}

const SHOT_LABEL = { chase: '추적', low: '로우', side: '사이드', top: '탑뷰', front: '프론트', orbit: '오빗' };
const SHOT_ORDER = ['chase', 'low', 'side', 'top', 'front', 'orbit'];
const FILM_SEQ = ['low', 'chase', 'side', 'top', 'orbit', 'front'];
const camPos = new THREE.Vector3(0, 3.5, 8), camLook = new THREE.Vector3(0, 0.9, -9);
let camFov = 68;
const _P = new THREE.Vector3(), _L = new THREE.Vector3();
function shotPose(name, t) {
  let fov = 68;
  switch (name) {
    case 'title': _P.set(Math.sin(t * 0.15) * 1.6, 1.15, 6.6); _L.set(0, 1.25, -18); fov = 64; break;
    case 'low': _P.set(Math.sin(t * 0.3) * 0.25, 0.6, 8.4); _L.set(0, 1.5, -20); fov = 62; break;
    case 'side': _P.set(3.7, 1.1, 2.9 + Math.sin(t * 0.25) * 0.5); _L.set(0.55, 0.45, -1.4); fov = 54; break;
    case 'top': _P.set(0, 12.5, 3.2); _L.set(0, 0, -3.6); fov = 58; break;
    case 'front': _P.set(Math.sin(t * 0.4) * 0.6, 1.25, -6.6); _L.set(0, 0.5, 0.4); fov = 56; break;
    case 'orbit': { const a = t * 0.22; _P.set(Math.sin(a) * 6.5, 2.4 + Math.sin(t * 0.3) * 0.6, Math.cos(a) * 6.5); _L.set(0, 0.6, 0); fov = 56; break; }
    default: _P.set(0, 2.25 + S.spread * 0.38, 4.6 + S.spread * 1.4); _L.set(0, 0.75, -10); fov = 70 + (S.speed - 24) * 0.12;
  }

}
function updateCamera(dt) {
  let shot = S.camShot;
  if (S.mode === 'title') shot = 'title';
  if (S.film && S.mode === 'play') {
    S.shotT += dt;
    if (S.shotT > 6.5) { S.shotT = 0; S.filmIdx = (S.filmIdx + 1) % FILM_SEQ.length; S.camShot = FILM_SEQ[S.filmIdx]; updateCamLabel(); }
  }
  const fov = shotPose(shot, simTime) + S.overdrive * 1.4;
  const k = (S.film || S.mode === 'title') ? 2.0 : 7.5;
  const f = S.snap ? 1 : 1 - Math.exp(-k * dt);
  S.snap = false;
  camPos.lerp(_P, f); camLook.lerp(_L, f); camFov = lerp(camFov, fov, f);
  camera.position.copy(camPos);
  if (S.shake > 0 && !REDUCED) {
    const a = S.shake * S.shake * 0.16;
    camera.position.x += Math.sin(simTime * 53.1) * a; camera.position.y += Math.sin(simTime * 61.7 + 1.3) * a;
  }
  camera.lookAt(camLook);

/* =====================================================================
   15. Per-frame simulation
   ===================================================================== */
const _hp = new THREE.Vector3();
function autopilot() {
  let best = null, bz = -1e9;
  for (const o of live) if (!o.resolved && o.z < 0 && o.z > -70 && o.z > bz && o.type !== 'star') { best = o; bz = o.z; }
  let target = best ? best.center : 1.4;
  let cz = -1e9, cx = null;
  for (const c of cores) if (c.on && c.side > 0 && c.z < -0.5 && c.z > -26 && c.z > cz) { cz = c.z; cx = c.x; }
  if (cx !== null && (!best || cz > bz)) target = cx;
  return target;
}
function nextGuide() {
  let best = null, bz = -1e9;
  for (const o of live) if (!o.resolved && o.type !== 'star' && o.z < -1 && o.z > bz) { best = o; bz = o.z; }
  return best;
}

function update(rawDt) {
  const dt = rawDt * (S.mode === 'paused' ? 0 : 1);
  S.timeScale = damp(S.timeScale, S.slow ? 0.35 : 1, 2.5, rawDt);
  const gdt = dt * S.timeScale;
  simTime += gdt;
  U.uTime.value = simTime;

  if (S.mode === 'paused') return;
  const gapTarget = difficulty();
  const dz = S.speed * gdt;
  S.dist += dz;
  U.uScroll.value = S.dist;

  // input
  if (S.auto || S.mode !== 'play') S.target = autopilot();
  else if (S.keys.l || S.keys.r) S.target = clamp(S.target + ((S.keys.r ? 1 : 0) - (S.keys.l ? 1 : 0)) * 3.4 * gdt, SMIN, SMAX);
  const prevSpread = S.spread;
  S.spread = clamp(damp(S.spread, S.target, 11, gdt), SMIN, SMAX);
  const sv = gdt > 0 ? (S.spread - prevSpread) / gdt : 0;

  // spawning
  if (S.mode !== 'over') {
    S.nextIn -= dz; S.sinceStar += dz;
    if (S.nextIn <= 0) { S.gap = gapTarget; S.nextIn += S.gap; spawnSection(); }
  }

  // obstacles
  for (const o of live) {
    o.prevZ = o.z; o.z += dz; o.group.position.z = o.z; o.update(gdt);
    if (!o.resolved && o.prevZ < 0 && o.z >= 0 && S.mode !== 'over') o.resolve(S.spread);
    if (o.z > 45) o.dead = true;
  }
  for (let i = live.length - 1; i >= 0; i--) if (live[i].dead) { live[i].active = false; live[i].group.visible = false; live.splice(i, 1); }

  // cores
  const t = simTime;
  for (let i = 0; i < CORE_N; i++) {
    const c = cores[i]; if (!c.on) continue;
    c.prevZ = c.z; c.z += dz;
    if (c.prevZ < 0 && c.z >= 0 && S.mode !== 'over') {
      if (Math.abs(S.spread - Math.abs(c.x)) < 0.42) {
        const col = c.side < 0 ? COL.castor : COL.pollux;
        sparks.emit(c.x, HOVER, 0, 18, col, 4, 0.5, 0.07, { up: 0.6 });
        if (c.side > 0) { S.combo++; if (S.mode === 'play' && !S.auto) addScore(50); Sound.blip(S.combo); }
        killCore(i); continue;
      }
    }
    if (c.z > 12) { killCore(i); continue; }
    const bob = Math.sin(t * 3 + c.ph) * 0.06;
    _q.setFromEuler(_e.set(t * 1.5 + c.ph, t * 2.2, 0));
    _m4.compose(_p.set(c.x, HOVER + bob, c.z), _q, _sc.set(1, 1, 1)); coreMesh.setMatrixAt(i, _m4);
    _q.setFromEuler(_e.set(Math.PI / 2 + Math.sin(t + c.ph) * 0.3, 0, t * 0.7));
    _m4.compose(_p, _q, _sc.set(1, 1, 1)); coreRing.setMatrixAt(i, _m4);
    _m4.makeTranslation(c.x, 0, c.z); corePillar.setMatrixAt(i, _m4);
  }
  coreMesh.instanceMatrix.needsUpdate = coreRing.instanceMatrix.needsUpdate = corePillar.instanceMatrix.needsUpdate = true;

  // scoring & state
  S.mult = 1 + Math.min(7, Math.floor(S.combo / 6));
  if (S.mode === 'play' && !S.auto) addScore(dz);
  S.overdrive = Math.max(0, S.overdrive - gdt);
  S.invuln = Math.max(0, S.invuln - gdt);
  S.shake = Math.max(0, S.shake - rawDt * 2.2);
  S.flash = Math.max(0, S.flash - rawDt * 1.6);
  U.uOver.value = damp(U.uOver.value, S.overdrive > 0 ? 1 : 0, 5, rawDt);
  if (S.mode === 'over') { S.overT += rawDt; if (S.overT > 1.4 && $('over').hidden) showOver(); }
  if (S.mode === 'play' && Math.floor(S.dist / 900) > Math.floor((S.dist - dz) / 900) && !S.auto) callout('SECTOR ' + (Math.floor(S.dist / 900) + 1), '속도 상승', 'var(--castor)');

  // ships
  const alive = S.mode !== 'over';
  for (const [sh, sign] of [[shipL, -1], [shipR, 1]]) {
    sh.vx = sv * sign;
    sh.group.position.set(sign * S.spread, HOVER + Math.sin(t * 2.1 + (sign > 0 ? 1.7 : 0)) * 0.035, 0);
    sh.body.rotation.z = damp(sh.body.rotation.z, -sh.vx * 0.09, 8, rawDt);
    sh.body.rotation.y = damp(sh.body.rotation.y, -sh.vx * 0.025, 8, rawDt);
    sh.body.rotation.x = Math.sin(t * 1.3 + sign) * 0.015;
    sh.group.visible = alive && !(S.invuln > 0 && Math.floor(simTime * 14) % 2 === 0);
    sh.flameMat.uniforms.uPower.value = 1 + U.uOver.value * 0.8;
    for (const f of sh.flames) f.scale.set(1, 1, 0.8 + S.speed / 40 + U.uOver.value * 0.6);
    const strobe = (simTime * 1.25 + (sign > 0 ? 0.5 : 0)) % 1 < 0.06 ? 7 : 0;
    sh.strobeMat.color.setRGB(strobe, strobe, strobe);
    sh.group.updateMatrixWorld();
  }
  tether.visible = alive;
  const tl = Math.max(0.01, 2 * (S.spread - WING + 0.04));
  tether.scale.set(tl, 1 + U.uOver.value * 0.6, 1); tether.position.set(0, HOVER - 0.01, 0.12);
  tetherMat.uniforms.uPower.value = 0.8 + 0.2 * Math.sin(t * 20);

  // trails
  const camP = camera.position;
  trails.forEach((tr) => {
    _hp.set(tr.ox, tr.oy, tr.oz); tr.ship.group.localToWorld(_hp);
    tr.rb.mesh.visible = alive;
    tr.rb.update(_hp, dz, camP);
  });

  // effects
  sparks.update(gdt, dz);
  shards.update(gdt, dz);
  if (S.mode === 'play' && !S.auto && S.overdrive > 0) {
    if (R() < 0.6) sparks.emit((R() * 2 - 1) * S.spread, HOVER, 0.6, 1, COL.gold, 2, 0.4, 0.05);
  }

  // world dressing
  for (let i = 0; i < bData.length; i++) {
    const b = bData[i];
    b.z += dz;
    if (b.z - b.d / 2 > WORLD_FRONT) { b.z -= WORLD_LEN; rollBuilding(i); }
    _m4.makeScale(b.w, b.h, b.d); _m4.setPosition(b.x, 0, b.z); buildings.setMatrixAt(i, _m4);
  }
  buildings.instanceMatrix.needsUpdate = true;
  buildings.geometry.attributes.aInfo.needsUpdate = true;
  for (let i = 0; i < POST_N; i++) {
    postZ[i] += dz; if (postZ[i] > WORLD_FRONT) postZ[i] -= WORLD_LEN;
    _m4.makeTranslation(-5.86, 0, postZ[i]); posts.setMatrixAt(i * 2, _m4);
    _m4.makeTranslation(5.86, 0, postZ[i]); posts.setMatrixAt(i * 2 + 1, _m4);
  }
  posts.instanceMatrix.needsUpdate = true;
  for (const s of signs) { s.position.z += dz; if (s.position.z > WORLD_FRONT) { s.position.z -= WORLD_LEN; s.position.y = rv(3, 10.5); } }
  for (const a of arches) { a.position.z += dz; if (a.position.z > 120) a.position.z -= 510; }
  rain.material.uniforms.uSpeed.value = S.speed;

  // road uniforms
  RU.uShipL.value.copy(shipL.group.position); RU.uShipR.value.copy(shipR.group.position);
  if (!alive) { RU.uShipL.value.y = -50; RU.uShipR.value.y = -50; RU.uShipL.value.x = RU.uShipR.value.x = 999; }
  const g = nextGuide();
  const showGuide = g && S.mode === 'play' && !S.auto;
  RU.uGuideA.value = damp(RU.uGuideA.value, showGuide ? sstep(-130, -60, g.z) : 0, 6, rawDt);
  if (g) { RU.uGuideX.value = damp(RU.uGuideX.value, g.center, 10, rawDt); RU.uGuideZ.value = g.z; }
  pulseT += gdt;
  RU.uPulseZ.value = -pulseT * 70; RU.uPulseA.value = Math.max(0, 1 - pulseT * 0.9) * 2; RU.uPulseCol.value.copy(pulseCol);

  // post
  lens.uniforms.uTime.value = simTime;
  bloom.strength = 0.6 + U.uOver.value * 0.3 + S.flash * 0.6;
  lens.uniforms.uCA.value = 0.0022 + U.uOver.value * 0.004 + S.flash * 0.006;
  lens.uniforms.uFlash.value = S.flash * 0.18; lens.uniforms.uFlashCol.value.copy(flashCol);

  sky.position.copy(camera.position);
  Sound.intensity = S.mode === 'play' ? clamp(0.3 + S.level / 3, 0.3, 1) : 0.4;
  updateCamera(rawDt * (S.mode === 'paused' ? 0 : S.timeScale < 1 ? Math.max(S.timeScale, 0.5) : 1));
}

const hud = $('hud'), rail = $('rail'), calloutEl = $('callout'), toastEl = $('toast');

function updateCamLabel() { $('camLabel').textContent = SHOT_LABEL[S.camShot] || '추적'; }

function syncRail() { rail.classList.toggle('is-menu', S.mode === 'title' || S.mode === 'paused' || !$('over').hidden); }
function showMenu() {

function resetRun(seed) {

  Object.assign(S, { spread: 1.4, target: 1.4, speed: 24, dist: 0, score: 0, combo: 0, mult: 1, shields: 3, overdrive: 0, invuln: 0, timeScale: 1, shake: 0, flash: 0, level: 0, nextIn: 34, gap: 40, lastCenter: 1.4, sinceStar: 900, overT: 0, shotT: 0, filmIdx: 0 });
  for (const tr of trails) { _hp.set(tr.ox, tr.oy, tr.oz); tr.ship.group.localToWorld(_hp); tr.rb.reset(_hp); }
}
function startGame(film, seed) {

// --- downloads (claude.ai downloads capability, with a plain-link fallback for local use)
const downloadsP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveFile(blob, filename) {
  let dl = null;
  try { dl = await Promise.race([downloadsP, new Promise((r) => setTimeout(() => r(null), 1500))]); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('저장했습니다: ' + filename); }
    catch (e) {
      if (e && e.code === 'declined') toast('저장을 취소했습니다.');
      else if (e && e.code === 'rate_limited') toast('다른 저장 확인 창이 열려 있습니다. 잠시 후 다시 시도하세요.');
      else toast('이 화면에서는 저장할 수 없습니다 (' + (e && e.code || 'unavailable') + ').');
    }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  toast('다운로드: ' + filename);
}
const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };

let shotRequest = false;
function requestShot() { shotRequest = true; }

let rec = null, recChunks = [], recStart = 0, recMime = '', recTimer = null;
function pickMime() {
  if (!window.MediaRecorder) return '';
  const list = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return list.find((m) => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } }) || '';
}
function toggleRec() {
  if (rec) { rec.stop(); return; }
  recMime = pickMime();
  if (!recMime || !canvas.captureStream) { toast('이 브라우저는 캔버스 녹화를 지원하지 않습니다. Chrome 또는 Edge에서 열어 주세요.'); return; }
  Sound.init();
  recording = true; layout();
  const stream = canvas.captureStream(60);
  if (Sound.dest) Sound.dest.stream.getAudioTracks().forEach((tr) => stream.addTrack(tr));
  try { rec = new MediaRecorder(stream, { mimeType: recMime, videoBitsPerSecond: 28_000_000, audioBitsPerSecond: 192_000 }); }
  catch (e) { recording = false; layout(); toast('녹화를 시작하지 못했습니다: ' + e.message); return; }
  recChunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    const ext = recMime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recChunks, { type: recMime.split(';')[0] });
    rec = null; recording = false; layout(); clearInterval(recTimer);
    $('recbadge').hidden = true; $('bRec').setAttribute('aria-pressed', 'false');
    saveFile(blob, `gemini-neon-${stamp()}.${ext}`);
    if (ext === 'webm') setTimeout(() => toast('WebM으로 저장됐습니다. After Effects에 넣기 전 MP4로 변환하세요.', 4200), 2800);
  };
  rec.start(500);
  recStart = performance.now();
  $('recbadge').hidden = false; $('bRec').setAttribute('aria-pressed', 'true');
  recTimer = setInterval(() => { const s = Math.floor((performance.now() - recStart) / 1000); $('rectime').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }, 250);
  toast(`녹화 시작 · 1080×1920 · ${recMime.startsWith('video/mp4') ? 'MP4' : 'WebM'} · HUD 제외`);
}

/* =====================================================================
   17. Layout + input
   ===================================================================== */
let exportRes = false, recording = false, resScale = 1;
const COARSE = matchMedia('(pointer: coarse)').matches;
const perf = { ema: 1 / 60, t: 0 };
function adaptResolution(rawDt) {
  if (exportRes || recording || manual) return;
  perf.ema = lerp(perf.ema, rawDt, 0.05); perf.t += rawDt;
  if (perf.t < 2.5) return;
  perf.t = 0;
  if (perf.ema > 1 / 45 && resScale > 0.5) { resScale = Math.max(0.5, resScale * 0.85); layout(); }
  else if (perf.ema < 1 / 57 && resScale < 1) { resScale = Math.min(1, resScale * 1.08); layout(); }
}
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let h = vh, w = (h * 9) / 16;
  if (w > vw) { w = vw; h = (w * 16) / 9; }
  stage.style.width = Math.floor(w) + 'px'; stage.style.height = Math.floor(h) + 'px';
  let bw, bh;
  if (exportRes || recording || manual) { bw = 1080; bh = 1920; }
  else {
    const pr = Math.min(window.devicePixelRatio || 1, 2);
    const cap = COARSE ? 1440 : 1920;
    bh = Math.max(540, Math.min(cap, Math.round(h * pr * resScale))); bw = Math.round((bh * 9) / 16);
  }
  renderer.setSize(bw, bh, false);
  composer.setSize(bw, bh);
  road.getRenderTarget().setSize(Math.round(bw * 0.5), Math.round(bh * 0.5));
  lens.uniforms.uRes.value.set(bw, bh);
  if (sparks) sparks.mat.uniforms.uPx.value = bh / (2 * Math.tan(THREE.MathUtils.degToRad(34)));
}
window.addEventListener('resize', layout);

const _pv = new THREE.Vector3();
function pointerToSpread(clientX) {
  const r = stage.getBoundingClientRect();
  const nx = ((clientX - r.left) / r.width) * 2 - 1;
  _pv.set(0, HOVER, 0).project(camera); const c0 = _pv.x;
  _pv.set(1, HOVER, 0).project(camera); const k = _pv.x - c0;
  return clamp(Math.abs(nx - c0) / Math.max(0.05, Math.abs(k)), SMIN, SMAX);
}
const isUi = (el) => el && el.closest && el.closest('button, .screen');
stage.addEventListener('pointerdown', (e) => {
  railWake();
  if (isUi(e.target)) return;
  S.pointer = true;
  if (S.mode === 'play' && !S.auto) S.target = pointerToSpread(e.clientX);
});
window.addEventListener('pointermove', (e) => {
  railWake();
  if (S.mode !== 'play' || S.auto) return;
  if (e.pointerType === 'mouse' || S.pointer) S.target = pointerToSpread(e.clientX);
});
window.addEventListener('pointerup', () => { S.pointer = false; });
window.addEventListener('pointercancel', () => { S.pointer = false; });

let idleTimer;
function railIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (S.film) rail.classList.add('is-idle'); }, 2600); }
function railWake() { rail.classList.remove('is-idle'); railIdle(); }

function cycleCam() {
  const i = SHOT_ORDER.indexOf(S.camShot);
  S.camShot = SHOT_ORDER[(i + 1) % SHOT_ORDER.length]; S.shotT = 0; updateCamLabel();
  if (S.film) S.filmIdx = Math.max(0, FILM_SEQ.indexOf(S.camShot));
  toast('카메라: ' + SHOT_LABEL[S.camShot], 1400);
}
function toggleSlow() { S.slow = !S.slow; $('bSlow').setAttribute('aria-pressed', String(S.slow)); toast(S.slow ? '슬로우 모션 0.35×' : '정상 속도', 1400); }
function toggleHud() { S.showHud = !S.showHud; $('bHud').setAttribute('aria-pressed', String(S.showHud)); }
function toggleRes() { exportRes = !exportRes; $('bRes').setAttribute('aria-pressed', String(exportRes)); layout(); toast(exportRes ? '내부 해상도 1080×1920 고정' : '화면 맞춤 해상도', 1600); }
function toggleSound() { Sound.init(); Sound.setMuted(!Sound.muted); $('bSnd').setAttribute('aria-pressed', String(!Sound.muted)); }

const onClick = (id, fn) => $(id).addEventListener('click', (e) => { e.stopPropagation(); fn(); });
onClick('bPlay', () => { Sound.init(); startGame(false); });
onClick('bFilm', () => { Sound.init(); startGame(true); });
onClick('bRetry', () => { Sound.init(); startGame(false); });
onClick('bOverMenu', () => { clearWorld(); showMenu(); });
onClick('bResume', () => togglePause(false));
onClick('bQuit', () => { clearWorld(); showMenu(); });
onClick('bRec', toggleRec);
onClick('bShot', requestShot);
onClick('bCam', cycleCam);
onClick('bSlow', toggleSlow);
onClick('bHud', toggleHud);
onClick('bRes', toggleRes);
onClick('bSnd', toggleSound);

window.addEventListener('keydown', (e) => {
  if (e.repeat && !['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) return;
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'KeyA') { S.keys.l = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'KeyD') { S.keys.r = true; e.preventDefault(); }
  else if (k === 'Space' || k === 'Enter') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    e.preventDefault(); Sound.init();
    if (S.mode === 'title' || S.mode === 'over') startGame(false); else if (S.mode === 'paused') togglePause(false);
  }
  else if (k === 'KeyP') togglePause();
  else if (k === 'Escape') { if (S.film) { clearWorld(); showMenu(); } else togglePause(); }
  else if (k === 'KeyC') cycleCam();
  else if (k === 'KeyH') toggleHud();
  else if (k === 'KeyF') { Sound.init(); startGame(true); }
  else if (k === 'KeyR') toggleRec();
  else if (k === 'KeyK') requestShot();
  else if (k === 'KeyT') toggleSlow();
  else if (k === 'KeyM') toggleSound();
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') S.keys.l = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') S.keys.r = false;
});
window.addEventListener('blur', () => { S.keys.l = S.keys.r = false; if (S.mode === 'play' && !S.film && !manual) togglePause(true); });

/* =====================================================================
   18. Boot + main loop (+ offline frame-exact render API)
   ===================================================================== */
let manual = false, fixedDt = 1 / 60;
function render() { composer.render(); }
function frame(dt) {
  update(dt);
  render();
  if (shotRequest) {
    shotRequest = false;
    canvas.toBlob((b) => { if (b) saveFile(b, `gemini-neon-${stamp()}.png`); }, 'image/png');
  }
  updateHud(dt);
}

async function boot() {
  try {
    await Promise.race([Promise.all([
      document.fonts.load('900 80px Unbounded'), document.fonts.load('800 30px Unbounded'),
      document.fonts.load('700 80px "IBM Plex Sans KR"'), document.fonts.load('500 16px "JetBrains Mono"'),
    ]), new Promise((r) => setTimeout(r, 2500))]);
  } catch (e) { /* fall back to system fonts */ }
  buildShipGeos();
  shipL = buildShip(0x2ee8ff, 'CASTOR', '01');
  shipR = buildShip(0xff3fd2, 'POLLUX', '02');
  sparks = new Sparks(1800);
  shards = new Shards(240);
  for (const [sh, sgn] of [[shipL, -1], [shipR, 1]]) {
    trails.push({ ship: sh, ox: 0, oy: -0.025, oz: 0.95, rb: new Ribbon(44, 0.2, sh.accent, 1.1) });
    trails.push({ ship: sh, ox: 0.665, oy: -0.035, oz: 0.5, rb: new Ribbon(36, 0.025, new THREE.Color(0.8, 0.85, 1), 0.9) });
    trails.push({ ship: sh, ox: -0.665, oy: -0.035, oz: 0.5, rb: new Ribbon(36, 0.025, new THREE.Color(0.8, 0.85, 1), 0.9) });
  }
  // warm the pools so shaders compile before play
  for (const t of ['gate', 'gate', 'laser', 'mono', 'star']) { const o = acquire(t); if (t === 'gate') o.spawn(1.4, 0.4, -500); else if (t === 'star') o.spawn(-500); else o.spawn(1.6, -500); }
  layout();
  update(1 / 60);
  renderer.compile(scene, camera);
  render();
  resetRun(20261122);
  for (let i = 0; i < 40; i++) update(1 / 30);
  showMenu();
  frame(1 / 60);
  window.__gnReady = true; clearTimeout(window.__gnBootTimer);
  $('loading').classList.add('done');
  let last = performance.now();
  const loop = (now) => {
    requestAnimationFrame(loop);
    if (manual) return;
    const real = (now - last) / 1000;
    const dt = clamp(real, 0, 1 / 20); last = Math.max(last, now);
    if (dt > 0) { frame(dt); adaptResolution(Math.min(real, 0.2)); }
  };
  requestAnimationFrame(loop);
}

// Frame-exact render hook used by render.mjs (Playwright) for constant-frame-rate exports.
window.__gn = {
  offline({ fps = 60, seed = 20261122, film = true, shot = null, warm = 1.5 } = {}) {
    manual = true; fixedDt = 1 / fps; layout();
    $('menu').hidden = true; $('over').hidden = true; rail.hidden = true; hud.classList.add('is-off');
    startGame(film, seed);
    $('toast').classList.remove('show');
    if (shot) { S.camShot = shot; S.film = false; S.auto = true; }
    for (let t = 0; t < warm; t += fixedDt) update(fixedDt);
    camPos.copy(_P); camLook.copy(_L);
    return { width: canvas.width, height: canvas.height };
  },
  step(n = 1) { if (n === 0) { update(fixedDt); return ''; } for (let i = 0; i < n; i++) update(fixedDt); render(); return canvas.toDataURL('image/png'); },
  setShot(name, cut = true) { S.camShot = name; S.snap = cut; },
  debug() { return { ts: S.timeScale, speed: S.speed, sim: simTime, P: _P.toArray(), L: _L.toArray(), camPos: camPos.toArray(), camLook: camLook.toArray(), camFov, shake: S.shake, over: S.overdrive, ready: !!window.__gnReady }; },
  state() { return { mode: S.mode, dist: S.dist, spread: S.spread, shot: S.camShot, live: live.length, shields: S.shields, score: Math.floor(S.score), combo: S.combo, od: +S.overdrive.toFixed(2), types: live.map((o) => o.type).join(','), cam: camera.position.toArray().map((v) => +v.toFixed(2)), fov: +camera.fov.toFixed(1) }; },
};

boot().catch((err) => {
  const p = document.querySelector('#loading p');
  if (p) p.textContent = '초기화 오류: ' + (err && err.message ? err.message : err);
  console.error(err);
});
</script>
